<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Contatos</title>
</head>
<body>
    <h1>Meus Contatos</h1>
    <div id="resultado"></div><hr>
</body>
<script>
    let contatos = [
        {
            "nome": "Amanda",
            "telefone": "1234-56789"
        },
        {
            "nome": "Sara",
            "telefone": "9876-54321"
        },
        {
            "nome": "Lucas",
            "telefone": "9517-46382"
        },
        {
            "nome": "Rafael",
            "telefone": "0359-46682"
        }
    ]

    for(let i = 0; i < contatos.length; i++){
        let contato = contatos[i]

        resultado.innerHTML += `
            <hr>
            Nome: ${contato.nome} - Telefone: ${contato.telefone}
            
        `
    }
</script>
</html>
