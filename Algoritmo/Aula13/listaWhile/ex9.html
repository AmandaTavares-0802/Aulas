<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_num"><br><br>
    <button onclick="pares()">S2 Pares</button>
    <div id="resultado"></div>
</body>
<script>
    function pares(){
        let numero = Number(ipt_num.value);
        let fraseFinal = ``
        let contador = 0;

        while(contador <= numero){
            fraseFinal += `<br>${contador}`

            contador += 2
        }

        resultado.innerHTML = fraseFinal
    }
</script>
</html>
