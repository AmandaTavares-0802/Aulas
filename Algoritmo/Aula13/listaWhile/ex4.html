<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S2 Pares</title>
</head>
<body>
    <button onclick="Pares()">S2 Pares</button>
    <div id="resultado"></div>
</body>
<script>
    function Pares(){
        let pares = 0;
        fraseFinal = ``;

        while(pares <= 100){
            fraseFinal += `<br>${pares}`;
            pares += 2
        }

        resultado.innerHTML = fraseFinal


    }
</script>
</html>
