<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="ipt_num" placeholder="Número de 0 a 200"><br><br>
    <button onclick="multiplo()">Viva o 7!</button>
    <div id="resultado"></div>
</body>
<script>
    function multiplo(){
        let numero = Number(ipt_num.value);
        let contador = 0;
        let fraseFinal = ``

        if(numero >= 0 && numero <= 200){
            while(contador <= numero){
                if(contador % 7 === 0){
                    fraseFinal += `${contador}<br>`
                }

                contador++
            }
        } else{
            fraseFinal = `Um número de 0 a 200`
        }

        resultado.innerHTML = fraseFinal
    }
</script>
</html>
