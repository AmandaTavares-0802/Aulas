<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHILE</title>
</head>
<body>
    <div id="resultado"></div>
</body>
<script>
    let numero_digitado = prompt("Tente acertar o número:")

    while(numero_digitado != 42){
        numero_digitado = prompt("Tente outro: ")
    }
</script>
</html>
