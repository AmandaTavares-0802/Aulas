<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="nota()">Sortear Nota para aluno</button>
    <div id="resultado"></div>
</body>
<script>
    function nota(){
        let num_alea = Math.random()
        let nota_sorteada = parseInt(num_alea * ((10*0.1) + 9)*10)/10;

        resultado.innerHTML = `${nota_sorteada}`
    }
</script>
</html>
