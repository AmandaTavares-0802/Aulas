<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear Time</button>
    <div id="resultado"></div>
</body>
<script>
    function sorteio(){
        let numero_aleatorio = Math.random();
        let sorteado = parseInt(numero_aleatorio * (4-1+1) + 1)
        let frase = ``

        if(sorteado == 1){
            frase = `<img src="https://upload.wikimedia.org/wikipedia/pt/b/b4/Corinthians_simbolo.png" alt="" width="150px">`
        } else if(sorteado == 2){
            frase = `<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Brasao_do_Sao_Paulo_Futebol_Clube.svg/3840px-Brasao_do_Sao_Paulo_Futebol_Clube.svg.png" alt="" width="150px">`
        } else if (sorteado == 3){
            frase = `<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Palmeiras_logo.svg/960px-Palmeiras_logo.svg.png" alt="" width="150px">`
        } else {
            frase = `<img src="https://upload.wikimedia.org/wikipedia/commons/1/15/Santos_Logo.png" alt="" width="150px">`
        }

        resultado.innerHTML = frase
        console.log(sorteado)
    }
</script>
</html>
