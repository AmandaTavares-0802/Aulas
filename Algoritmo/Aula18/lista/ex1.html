<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear</button>
    <div id="id_resultado"></div>
</body>
<script>
    function sorteio(){
        let numero_aleatorio = Math.random()
        let frase = ``
        if(numero_aleatorio >= 0.5){
            frase = `Eu arredondaria para 1`
        } else {
            frase = `Eu arredondaria para 0`
        }

        id_resultado.innerHTML = frase;
        console.log(numero_aleatorio);
        
    }
</script>
</html>
