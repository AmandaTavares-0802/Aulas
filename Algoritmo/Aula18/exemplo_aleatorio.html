<!DOCTYPE html>

<script>
    //Gera um código de 0 a 1
    //Onde 0 é inclusivo, e 1 exclusivo
    //ou seja, 0 até 0,99999999
    let aleatorio = Math.random();
    console.log(`Número aleatório : ${aleatorio}`)

    //Com intervalo:
    let min = 3;
    let max = 7;
    let aleatorio_teste = Math.random()
    let aleatorio_intervalo = parseInt(aleatorio_teste * (max - min + 1) + min)
    console.log(`Número aleatório com intervalo: ${aleatorio_intervalo}`);
    
    let aleatorio_sorteio = Math.random()
    let numero_sorteio = parseInt(aleatorio_sorteio * (10-3+1) + 3)
    while(numero_sorteio != 7){
        console.log(`Erro, a resposta é 7 e o número sorteado é ${numero_sorteio}`)
        aleatorio_sorteio = Math.random()
        numero_sorteio = parseInt(aleatorio_sorteio * (10-3+1) + 3)
    }
    console.log(`Agora sim, 7`);
    
</script>
</html>
