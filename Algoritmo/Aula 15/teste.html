<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Temperatura e Umidade</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .container {
      width: 80%;
      margin: auto;
    }

    canvas {
      background: white;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>
  <h1>Monitoramento de Temperatura e Umidade</h1>

  <div class="container">
    <canvas id="grafico"></canvas>
  </div>

  <script>
    const ctx = document.getElementById('grafico');

    const data = {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [
        {
          label: 'Temperatura (°C)',
          data: [30, 29, 28, 25, 22, 23],
          borderColor: 'red',
          backgroundColor: 'rgba(255, 0, 0, 0.2)',
          tension: 0.4
        },
        {
          label: 'Umidade (%)',
          data: [80, 82, 80, 85, 80, 83],
          borderColor: 'blue',
          backgroundColor: 'rgba(0, 0, 255, 0.2)',
          tension: 0.4
        }
      ]
    };

    const config = {
      type: 'line',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'top'
          }
        },
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    };

    new Chart(ctx, config);
  </script>
</body>
</html>
